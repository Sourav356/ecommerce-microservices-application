apiVersion: v1

kind: Service
metadata:
  name: api-gateway
  namespace: {{.Values.namespace}}
  labels:
    app: api-gateway

spec:
  selector:
    app: api-gateway
    
  ports:
    - port: {{.Values.apiGateway.service.port}}

      targetPort: {{.Values.apiGateway.service.port}}

  type: ClusterIP