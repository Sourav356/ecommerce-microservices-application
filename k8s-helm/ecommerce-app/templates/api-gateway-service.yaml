{{- $svc := index .Values "api-gateway" -}}
apiVersion: v1
kind: Service

metadata:
  name: api-gateway
  namespace: {{ .Values.namespace }}
  labels:
    app: api-gateway

spec:
  selector:
    app: api-gateway

  ports:
    - port: {{ $svc.service.port }}
      targetPort: {{ $svc.service.port }}

  type: ClusterIP