apiVersion: v1

kind: Service
metadata:
  name: user-service
  namespace: {{.Values.namespace}}
  labels:
    app: user-service

spec:
  selector:
    app: user-service

  ports:
    - port: {{.Values.user-service.service.port}}

      targetPort: {{.Values.user-service.service.port}}

  type: ClusterIP


  