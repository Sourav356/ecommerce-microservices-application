# 1. Create the missing namespace first
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets

---
# 2. Create the ServiceAccount inside it
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: external-secrets
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::637043415174:role/external-secrets-role"
