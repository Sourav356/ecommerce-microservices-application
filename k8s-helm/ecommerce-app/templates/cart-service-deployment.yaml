apiVersion: apps/v1

kind: Deployment
metadata:
  name: cart-service
  namespace: {{.Values.namespace}}
  labels:
    app: cart-service

spec:
  replicas: {{.Values.cart-service.replicaCount}}
  selector:
    matchLabels:
      app: cart-service

  template:
    metadata:
      labels:
        app: cart-service

    spec:
      containers:
        - name: cart-service
          image: "{{.Values.cart-service.image.repository}}:{{.Values.cart-service.image.tag}}"
          ports:
            - containerPort: {{.Values.cart-service.service.port}}

          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: DB_PORT

            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: DB_USER

            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: DB_NAME

            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: ecommerce-app-secret
                  key: DB_PASS

          readinessProbe:
            httpGet:
              path: /health
              port: {{.Values.cart-service.service.port}}

            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: {{.Values.cart-service.service.port}}

            initialDelaySeconds: 30
            periodSeconds: 10

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"

            limits:
              memory: "256Mi"
              cpu: "200m"