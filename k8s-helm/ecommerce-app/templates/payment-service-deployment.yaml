apiVersion: apps/v1
kind: Deployment

{{- $svc := index .Values "payment-service" -}}

metadata:
  name: payment-service
  namespace: {{.Values.namespace}}
  labels:
    app: payment-service

spec:
  replicas: {{ $svc.replicaCount }}
  selector:
    matchLabels:
      app: payment-service

  template:
    metadata:
      labels:
        app: payment-service

    spec:
      containers:
        - name: payment-service
          image: "{{ $svc.image.repository }}:{{ $svc.image.tag }}"
          ports:
            - containerPort: {{ $svc.service.port }}

          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: ecommerce-app-secret
                  key: DB_URL

          readinessProbe:
            httpGet:
              path: /health
              port: {{ $svc.service.port }}

            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: {{ $svc.service.port }}

            initialDelaySeconds: 30
            periodSeconds: 10

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"

            limits:
              memory: "256Mi"
              cpu: "200m"