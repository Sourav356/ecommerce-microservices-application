{{- $svc := index .Values "notification-service" -}}
apiVersion: apps/v1
kind: Deployment


metadata:
  name: notification-service
  namespace: {{.Values.namespace}}
  labels:
    app: notification-service

spec:
  replicas: {{ $svc.replicaCount }}
  selector:
    matchLabels:
      app: notification-service

  template:
    metadata:
      labels:
        app: notification-service

    spec:
      containers:
        - name: notification-service
          image: "{{ $svc.image.repository }}:{{ $svc.image.tag }}"
          ports:
            - containerPort: {{ $svc.service.port }}

          readinessProbe:
            httpGet:
              path: /health
              port: {{ $svc.service.port }}

            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: {{ $svc.service.port }}

            initialDelaySeconds: 30
            periodSeconds: 10

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"

            limits:
              memory: "256Mi"
              cpu: "200m"