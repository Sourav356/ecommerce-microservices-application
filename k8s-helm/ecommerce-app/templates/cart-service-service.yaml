apiVersion: v1

kind: Service
metadata:
  name: cart-service
  namespace: {{.Values.namespace}}
  labels:
    app: cart-service

spec:
  selector:
    app: cart-service

  ports:
    - port: {{.Values.cart-service.service.port}}

      targetPort: {{.Values.cart-service.service.port}}

  type: ClusterIP
