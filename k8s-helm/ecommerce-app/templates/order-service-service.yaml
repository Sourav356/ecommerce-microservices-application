apiVersion: v1

kind: Service
metadata:
  name: order-service
  namespace: {{.Values.namespace}}
  labels:
    app: order-service

spec:
  selector:
    app: order-service

  ports:
    - port: {{.Values.order-service.service.port}}

      targetPort: {{.Values.order-service.service.port}}

  type: ClusterIP
