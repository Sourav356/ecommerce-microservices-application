apiVersion: v1
kind: Service

{{- $svc := index .Values "order-service" -}}

metadata:
  name: order-service
  namespace: {{.Values.namespace}}
  labels:
    app: order-service

spec:
  selector:
    app: order-service

  ports:
    - port: {{ $svc.service.port }}

      targetPort: {{ $svc.service.port }}

  type: ClusterIP
