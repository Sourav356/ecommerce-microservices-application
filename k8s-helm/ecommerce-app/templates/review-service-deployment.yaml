{{- $svc := index .Values "review-service" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service
  namespace: {{.Values.namespace}}
  labels:
    app: review-service
spec:
  replicas: {{ $svc.replicaCount }}
  selector:
    matchLabels:
      app: review-service
  template:
    metadata:
      labels:
        app: review-service
    spec:
      containers:
        - name: review-service
          image: "{{ $svc.image.repository }}:{{ $svc.image.tag }}"
          ports:
            - containerPort: {{ $svc.service.port }}

          # Highlight-start
          # Loads all variables from the ConfigMap automatically (including PGSSLMODE)
          envFrom:
            - configMapRef:
                name: ecommerce-config
          # Highlight-end

          env:
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: ecommerce-app-secret
                  key: DB_PASS

          readinessProbe:
            httpGet:
              path: /health
              port: {{ $svc.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $svc.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
