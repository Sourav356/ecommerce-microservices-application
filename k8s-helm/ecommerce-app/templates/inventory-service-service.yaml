apiVersion: v1
kind: Service

{{- $svc := index .Values "inventory-service" -}}

metadata:
  name: inventory-service
  namespace: {{.Values.namespace}}
  labels:
    app: inventory-service

spec:
  selector:
    app: inventory-service

  ports:
    - port: {{ $svc.service.port }}

      targetPort: {{ $svc.service.port }}

  type: ClusterIP
