apiVersion: v1

kind: Service
metadata:
  name: inventory-service
  namespace: {{.Values.namespace}}
  labels:
    app: inventory-service

spec:
  selector:
    app: inventory-service

  ports:
    - port: {{.Values.inventory-service.service.port}}

      targetPort: {{.Values.inventory-service.service.port}}

  type: ClusterIP
