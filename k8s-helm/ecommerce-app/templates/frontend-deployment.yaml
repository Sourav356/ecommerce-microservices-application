{{- $svc := index .Values "frontend" -}}
apiVersion: apps/v1
kind: Deployment


metadata:
  name: frontend-ec
  namespace: {{.Values.namespace}}
  labels:
    app: frontend-ec

spec:
  replicas: {{ $svc.replicaCount }}
  selector:
    matchLabels:
      app: frontend-ec
  template:
    metadata:
      labels:
        app: frontend-ec
    
    spec:
      containers:
        - name: frontend-ec
          image: "{{ $svc.image.repository }}:{{ $svc.image.tag }}"
          ports:
            - containerPort: {{ $svc.service.port }}

          
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $svc.service.port }}

            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: {{ $svc.service.port }}

            initialDelaySeconds: 30
            periodSeconds: 10

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"

            limits:
              memory: "128Mi"
              cpu: "100m"