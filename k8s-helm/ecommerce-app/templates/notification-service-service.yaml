apiVersion: v1

kind: Service
metadata:
  name: notification-service
  namespace: {{.Values.namespace}}
  labels:
    app: notification-service

spec:
  selector:
    app: notification-service

  ports:
    - port: {{.Values.notification-service.service.port}}

      targetPort: {{.Values.notification-service.service.port}}

  type: ClusterIP
