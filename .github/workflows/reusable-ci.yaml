name: Reusable Service CI

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
    secrets:
      SONAR_TOKEN:
        required: true
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_ACCOUNT_ID:
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
          token: ${{ secrets.GITHUB_TOKEN }}

      # 1. SONARQUBE ANALYSIS (FIXED: Added java bytecode configuration properties fallback)
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://sonarcloud.io" 
        with:
          args: >
            -Dsonar.projectKey=ecommerce-microservices-application
            -Dsonar.organization=sourav356 
            -Dsonar.sources=${{ inputs.service_name }}
            -Dsonar.qualitygate.wait=false
            -Dsonar.java.binaries=.

      # 2. LOCAL DOCKER BUILD
      - name: Build local image for scanning
        run: |
          docker build -t my-app:${{ github.sha }} ./${{ inputs.service_name }}

      # 3. TRIVY VULNERABILITY SCAN
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: 'my-app:${{ github.sha }}'
          format: 'table'
          exit-code: '0' 
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # 4. LOG IN TO AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-2 

      # 5. LOG IN TO AMAZON ECR
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 6. BUILD & PUSH TO AWS ECR
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.service_name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./${{ inputs.service_name }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            # 7. HANDOVER TO MANIFESTS (FIXED: Official Marketplace Action Engine)
      - name: Update Helm values.yaml Tag
        uses: mikefarah/yq@master
        with:
          cmd: yq -i ".[\"${{ inputs.service_name }}\"].image.tag = \"${{ github.sha }}\"" ./k8s-helm/ecommerce-app/values.yaml

      - name: Commit and Push Changes back to Monorepo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Pull latest branch configurations to prevent merge conflict race condition delays
          git pull origin main --rebase
          
          git add ./k8s-helm/ecommerce-app/values.yaml
          git commit -m "chore(gitops): auto-update ${{ inputs.service_name }} tag to ${{ github.sha }}"
          git push origin main

