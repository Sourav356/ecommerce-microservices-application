name: API Gateway CI

on:
  push:
    branches: [ main ]
    paths:
      - 'api-gateway/**' # Triggers only when files inside the api-gateway folder change
      - '!k8s-helm/**'


jobs:
  trigger-ci:
    uses: ./.github/workflows/reusable-ci.yaml
    with:
      service_name: 'api-gateway' # Matches your folder name exactly
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
