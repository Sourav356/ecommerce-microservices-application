name: User Service CI

on:
  push:
    branches: [ main ]
    paths:
      - 'user-service/**' # Triggers only when files inside the user-service folder change
      - '!k8s-helm/**'
    
    

concurrency:
  group: gitops-manifest-updates
  cancel-in-progress: true # Keeps the queue clean
      


jobs:
  trigger-ci:
    uses: ./.github/workflows/reusable-ci.yaml
    with:
      service_name: 'user-service' # Matches your folder name exactly
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
